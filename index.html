<title>Roda da Convivência Senac</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrambleTextPlugin.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.net.min.js"></script>
<style>
/* Layout: palco de game show. Roleta à esquerda, placar à direita; cada fase (suspense, desafio, revelação) abre em tela cheia por cima do palco. */
:root {
  color-scheme: dark;
  --stage: #06162e;
  --stage-2: #0c2549;
  --panel: #10305c;
  --line: #24497e;
  --ink: #f2f6fc;
  --muted: #a3b6d3;
  --blue: #1a6ad1;
  --navy: #004a8d;
  --orange: #f6921e;
  --gold: #ffcf4d;
  --good: #2fc27a;
  --bad: #ff5a5f;
  --disc: #c86bff;
  --swap: #3fd0c9;
  --p-red: #e5484d;
  --p-green: #2aa866;
  --p-blue: #2f7fe0;
  --p-yellow: #f5c518;
  --on-yellow: #2b2100;
  --font-display: "Bricolage Grotesque", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --r: 18px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: radial-gradient(1200px 700px at 30% 10%, #12366b 0%, var(--stage) 60%) fixed, var(--stage);
  color: var(--ink); font-family: var(--font-body); font-size: 16px; margin: 0; overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: -0.01em; }
.eyebrow { font-size: 0.78rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--orange); margin: 0; }

/* ---------- Topo ---------- */
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--stage) 80%, transparent);
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: var(--navy); border: 2px solid var(--orange); font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; flex: none; }
.brand h1 { font-size: 1.25rem; line-height: 1.1; }
.brand p { margin: 2px 0 0; font-size: 0.72rem; color: var(--muted); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.tool { padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 0.8rem; font-weight: 700; color: var(--muted); background: var(--stage-2); }
.tool:hover { color: var(--ink); border-color: var(--orange); }
.tool[aria-pressed="false"] { opacity: 0.6; }

/* ---------- Palco ---------- */
.stage {
  display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: clamp(20px, 4vw, 56px);
  align-items: center; max-width: 1360px; margin: 0 auto;
  padding-block: clamp(16px, 3vw, 36px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wheel-wrap { position: relative; width: min(100%, 640px); aspect-ratio: 1; margin: 0 auto; max-width: 100%; }
.wheel-wrap::before { content: ""; position: absolute; inset: -4%; border-radius: 50%; background: radial-gradient(circle, rgba(246,146,30,0.28), transparent 65%); filter: blur(8px); }
#wheel { position: relative; width: 100%; height: 100%; display: block; }
.pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); z-index: 3; width: 0; height: 0; border-left: 26px solid transparent; border-right: 26px solid transparent; border-top: 52px solid var(--gold); filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); transform-origin: 50% 0; }
.pointer.kick { animation: kick 0.12s ease-out; }
@keyframes kick { 50% { transform: translateX(-50%) rotate(-14deg); } }
.side { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.round-info { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.round-info h2 { font-size: clamp(1.8rem, 3.4vw, 2.8rem); line-height: 1; }
.round-info .count { font-family: var(--font-display); font-size: 1.1rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.mode-pill { display: inline-flex; gap: 6px; align-items: center; padding: 5px 12px; border-radius: 999px; background: var(--stage-2); border: 1px solid var(--line); font-size: 0.8rem; font-weight: 800; color: var(--muted); }
.progress { height: 8px; border-radius: 99px; background: var(--stage-2); overflow: hidden; border: 1px solid var(--line); }
.progress span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--orange), var(--gold)); transition: width 0.6s ease; }
.board { display: grid; gap: 10px; }
.team { display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 14px; background: var(--stage-2); border: 2px solid transparent; transition: border-color 0.3s, background 0.3s; }
.team .dot { width: 14px; height: 14px; border-radius: 50%; }
.team .name { font-weight: 800; font-size: 1.05rem; min-width: 0; overflow-wrap: anywhere; }
.team .score { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; font-variant-numeric: tabular-nums; display: inline-block; }
.team.active { border-color: var(--orange); background: var(--panel); transform: translateX(-6px); }
.team.active .name::after { content: "  ● na vez"; font-size: 0.72rem; color: var(--orange); letter-spacing: 0.08em; text-transform: uppercase; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); font-weight: 700; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.spin { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 22px 28px; border-radius: 999px; background: linear-gradient(180deg, #ffad45, var(--orange)); color: #2a1300; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.4rem, 2.6vw, 2rem); letter-spacing: 0.02em; box-shadow: 0 8px 0 #b8640a, 0 16px 40px rgba(246,146,30,0.35); transition: box-shadow 0.12s; }
.spin:active { box-shadow: 0 2px 0 #b8640a; }
.spin:disabled { filter: grayscale(0.6); opacity: 0.6; cursor: not-allowed; }
.spin kbd, .hint kbd { font-family: var(--font-body); font-size: 0.7rem; padding: 2px 6px; border-radius: 6px; border: 1px solid currentColor; opacity: 0.7; }
.hint { font-size: 0.85rem; color: var(--muted); text-align: center; margin: 0; }

/* ---------- Telas ---------- */
.screen {
  position: fixed; inset: 0; z-index: 40; overflow-y: auto;
  padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(3, 12, 28, 0.95); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center;
}
.screen > .inner { position: relative; z-index: 1; width: 100%; max-width: 1180px; margin: auto; }
#stage-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; transform-origin: 30% 50%; filter: brightness(0.6); }
.top, .stage { position: relative; z-index: 1; }
.top { background: color-mix(in srgb, var(--stage) 70%, transparent) !important; }
.screen.clear { background: rgba(3, 12, 28, 0.62); }
.rays { position: absolute; left: 50%; top: 50%; width: 175%; aspect-ratio: 1; transform: translate(-50%, -50%); opacity: 0; pointer-events: none; border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, rgba(255,207,77,0.24) 0deg 6deg, transparent 6deg 18deg);
  -webkit-mask: radial-gradient(circle, #000 0 22%, transparent 62%); mask: radial-gradient(circle, #000 0 22%, transparent 62%); }
.wglow { position: absolute; inset: 1%; border-radius: 50%; pointer-events: none; }
.ring { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; border-radius: 50%; border: 6px solid var(--c, var(--gold)); transform: translate(-50%, -50%); opacity: 0; pointer-events: none; }
#flash { position: fixed; inset: 0; z-index: 70; background: #fff; opacity: 0; pointer-events: none; }
#landpop { position: fixed; z-index: 75; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: clamp(14px, 2.4vw, 26px) clamp(22px, 4vw, 44px); border-radius: 22px; text-align: center; background: rgba(6,22,46,0.9); border: 3px solid var(--c, var(--gold)); box-shadow: 0 0 80px var(--c, var(--gold)); opacity: 0; visibility: hidden; pointer-events: none; max-width: calc(100% - 32px); }
#landpop small { display: block; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
#landpop b { font-family: var(--font-display); font-size: clamp(2rem, 6vw, 4.4rem); line-height: 1; }
/* Revelação em cartões-chave */
.ra { max-width: 1000px !important; display: grid; gap: clamp(12px, 1.8vw, 18px); }
.ra-top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.ra-thumb { width: clamp(64px, 8vw, 96px); aspect-ratio: 1; border-radius: 16px; overflow: hidden; flex: none; border: 2px solid rgba(255,255,255,0.18); background: #fff; }
.ra-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ra-thumb.contain img { object-fit: contain; }
.ra-head { display: grid; gap: 4px; min-width: 0; }
.ra-head .line { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.pts-up { font-family: var(--font-display); color: var(--gold); font-size: clamp(1.1rem, 2.2vw, 1.6rem); font-variant-numeric: tabular-nums; }
.slogan { font-family: var(--font-display); font-size: clamp(1.7rem, 4vw, 3.2rem); line-height: 1.08; margin: 0; }
.slogan mark { color: inherit; background: linear-gradient(transparent 58%, rgba(255,207,77,0.5) 58%) no-repeat; background-size: 0% 100%; padding: 0 4px; transition: background-size 0.9s ease; }
.slogan mark.on { background-size: 100% 100%; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; perspective: 1000px; }
.kc { padding: clamp(12px, 1.6vw, 18px); border-radius: 16px; background: var(--panel); border-top: 5px solid var(--c); display: grid; gap: 6px; align-content: start; }
.kc .ic { font-size: clamp(1.4rem, 2.6vw, 2rem); line-height: 1; }
.kc h4 { margin: 0; font-size: 0.74rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--c); }
.kc b { font-family: var(--font-display); font-size: clamp(1.05rem, 1.8vw, 1.45rem); line-height: 1.15; }
.kc b.strike { text-decoration: line-through; text-decoration-color: var(--bad); text-decoration-thickness: 3px; color: #ffc4c6; }
.kc p { margin: 0; color: #c8d6ea; font-size: clamp(0.85rem, 1.25vw, 0.98rem); line-height: 1.45; }
.talkbar { padding: 12px 16px; border-radius: 14px; background: rgba(255,207,77,0.1); border: 2px dashed var(--gold); font-size: 1.05rem; line-height: 1.45; }
.talkbar b { color: var(--gold); }
.extra { padding: 12px 16px; border-radius: 14px; background: rgba(63,208,201,0.1); border-left: 5px solid var(--swap); line-height: 1.5; }
.extra b { color: #a8f1ec; }
.more { border-radius: 14px; background: var(--stage-2); padding: 12px 16px; }
.more summary { cursor: pointer; font-weight: 800; color: var(--muted); }
.more summary:hover { color: var(--ink); }
.more .inner-more { display: grid; gap: 10px; margin-top: 10px; }
.more p { margin: 0; color: #d6e2f3; line-height: 1.55; }
.more h5 { margin: 0 0 4px; font-size: 0.74rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--orange); }

/* Configuração */
.setup { max-width: 860px !important; display: grid; gap: 24px; }
.setup h2 { font-size: clamp(2.2rem, 5vw, 3.6rem); line-height: 1.02; }
.setup h2 em { font-style: normal; color: var(--orange); }
.setup .lead { color: var(--muted); font-size: 1.05rem; line-height: 1.55; margin: 10px 0 0; max-width: 62ch; }
.field { display: grid; gap: 10px; }
.field > .label { font-weight: 800; font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { padding: 10px 16px; border-radius: 12px; border: 2px solid var(--line); background: var(--stage-2); font-weight: 700; }
.chip[aria-pressed="true"] { border-color: var(--orange); background: var(--panel); color: var(--gold); }
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.mode { text-align: left; display: grid; align-content: start; gap: 6px; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--stage-2); }
.mode b { font-family: var(--font-display); font-size: 1.15rem; }
.mode span { color: var(--muted); font-size: 0.88rem; line-height: 1.4; }
.mode[aria-pressed="true"] { border-color: var(--orange); background: var(--panel); }
.mode[aria-pressed="true"] b { color: var(--gold); }
.names { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.names input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--stage-2); color: var(--ink); font: inherit; font-weight: 700; }
.plates { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 0.92rem; }
.plate { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--ink); }
.plate i { width: 22px; height: 16px; border-radius: 4px; display: inline-block; }
.cta { justify-self: start; padding: 18px 30px; border-radius: 14px; background: var(--orange); color: #2a1300; font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; box-shadow: 0 6px 0 #b8640a; }
.cta:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8640a; }
.ghost { padding: 14px 22px; border-radius: 14px; border: 2px solid var(--line); font-weight: 800; }
.ghost:hover { border-color: var(--orange); }

/* Suspense */
.suspense { display: grid; justify-items: center; gap: 20px; text-align: center; cursor: pointer; }
.suspense .art { width: min(54vh, 84vw); aspect-ratio: 1; max-width: 100%; border-radius: 28px; overflow: hidden; border: 4px solid rgba(255,255,255,0.18); box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 12px rgba(246,146,30,0.12); background: #f3f5f9; }
.suspense .art img, .rv-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.contain img { object-fit: contain !important; background: #fff; }
.suspense h2 { font-size: clamp(2rem, 5vw, 3.6rem); min-height: 1.1em; }
.suspense .tap { font-weight: 700; color: var(--muted); animation: pulse 1.6s infinite; margin: 0; }
@keyframes pulse { 50% { opacity: 0.45; } }
.kind { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; font-weight: 800; font-size: 0.85rem; letter-spacing: 0.06em; text-transform: uppercase; }
.kind.reg { background: rgba(246,146,30,0.16); color: var(--orange); border: 1px solid var(--orange); }
.kind.disc { background: rgba(200,107,255,0.16); color: #e3b6ff; border: 1px solid var(--disc); }
.kind.trocar { background: rgba(63,208,201,0.16); color: #a8f1ec; border: 1px solid var(--swap); }

/* Desafio */
.challenge { display: grid; gap: clamp(14px, 2.2vw, 24px); }
.ch-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.ch-tags { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.tag { padding: 7px 14px; border-radius: 999px; font-weight: 800; font-size: 0.85rem; background: var(--panel); border: 1px solid var(--line); }
.tag.turn { background: var(--orange); color: #2a1300; border-color: transparent; }
.timer { position: relative; width: 88px; height: 88px; flex: none; }
.timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer circle { fill: none; stroke-width: 9; }
.timer .track { stroke: var(--stage-2); }
.timer .bar { stroke: var(--gold); stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke 0.3s; }
.timer.low .bar { stroke: var(--bad); }
.timer b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 2rem; font-variant-numeric: tabular-nums; }
.timer.low b { color: var(--bad); animation: pulse 0.5s infinite; }
.question { font-size: clamp(1.5rem, 3.1vw, 2.5rem); line-height: 1.18; max-width: 34ch; }
.question small { display: block; font-family: var(--font-body); font-size: 0.5em; font-weight: 600; color: var(--muted); margin-bottom: 10px; letter-spacing: 0; }
.question .hl { color: #e3b6ff; }
.quote { font-family: var(--font-display); font-size: clamp(1.8rem, 4vw, 3rem); line-height: 1.12; padding: 22px 24px 18px; border-radius: 18px; background: rgba(255,90,95,0.1); border: 2px dashed var(--bad); color: #ffd3d4; max-width: 30ch; position: relative; margin: 6px 0 0; }
.quote::before { content: "Frase a evitar"; position: absolute; top: -12px; left: 18px; padding: 2px 10px; border-radius: 99px; background: var(--bad); color: #fff; font-family: var(--font-body); font-size: 0.72rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
.banner { padding: 12px 18px; border-radius: 12px; font-weight: 800; font-size: 1.05rem; background: rgba(255,90,95,0.14); border: 2px solid var(--bad); color: #ffd3d4; animation: shake 0.4s; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.opt { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 16px; text-align: left; padding: 16px 18px; border-radius: var(--r); background: var(--stage-2); border: 3px solid var(--line); font-size: clamp(1rem, 1.5vw, 1.2rem); font-weight: 600; line-height: 1.32; transition: border-color 0.15s; }
.options.long .opt { font-size: clamp(0.95rem, 1.35vw, 1.1rem); font-weight: 500; }
.opt:hover:not(:disabled) { border-color: var(--c); }
.opt .key { width: 58px; height: 58px; border-radius: 14px; display: grid; place-items: center; background: var(--c); color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; line-height: 1; }
.opt .key small { display: block; font-family: var(--font-body); font-size: 0.55rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
.opt[data-c="3"] .key, .answer[data-c="3"] .key, .others li[data-c="3"] .k { color: var(--on-yellow); }
.opt span.txt { min-width: 0; }
.opt.wrong { opacity: 0.35; border-color: var(--bad); text-decoration: line-through; }
.opt.right { border-color: var(--good); background: rgba(47,194,122,0.16); animation: glow 0.9s 2; }
@keyframes glow { 50% { box-shadow: 0 0 0 8px rgba(47,194,122,0.3); } }
.opt:disabled { cursor: default; }
.ch-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.steal { display: grid; gap: 12px; padding: 16px; border-radius: var(--r); background: var(--panel); border: 2px solid var(--good); }
.steal p { margin: 0; font-weight: 800; }

/* Revelação */
.reveal { display: grid; grid-template-columns: minmax(0, 0.75fr) minmax(0, 1.25fr); gap: clamp(18px, 3vw, 40px); align-items: start; }
.rv-art { border-radius: 24px; overflow: hidden; aspect-ratio: 1; max-width: 100%; background: #f3f5f9; border: 3px solid rgba(255,255,255,0.15); position: sticky; top: 0; }
.rv-body { display: grid; gap: 16px; min-width: 0; }
.verdict { font-size: clamp(2.2rem, 4.6vw, 3.6rem); line-height: 1; }
.verdict.ok { color: var(--good); } .verdict.no { color: var(--bad); }
.verdict-sub { margin: 6px 0 0; color: var(--muted); font-weight: 700; font-size: 1.05rem; }
.answer { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 14px; background: rgba(47,194,122,0.12); border: 2px solid var(--good); font-weight: 700; font-size: 1.08rem; line-height: 1.4; }
.answer .key { width: 44px; height: 44px; border-radius: 10px; background: var(--c); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; color: #fff; }
.swap-show { display: grid; gap: 8px; }
.swap-show .from { font-family: var(--font-display); font-size: 1.3rem; color: #ffb3b6; position: relative; justify-self: start; }
.swap-show .from::after { content: ""; position: absolute; left: -4px; right: -4px; top: 52%; height: 3px; background: var(--bad); transform-origin: left; animation: strike 0.6s 0.5s both; }
@keyframes strike { from { transform: scaleX(0); } }
.swap-show .arrow { color: var(--swap); font-weight: 800; }

.legal { padding: 14px 18px; border-radius: 14px; background: var(--stage-2); border-left: 5px solid var(--blue); }

.dtag { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: rgba(200,107,255,0.16); border: 1px solid var(--disc); color: #f0d9ff; font-weight: 800; font-size: 0.85rem; }
.others { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }

.others .k { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; background: var(--c); color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 0.95rem; }
.others b { color: #e3b6ff; }
.rv-foot { display: flex; gap: 12px; flex-wrap: wrap; }

/* Final */
.final { text-align: center; display: grid; gap: 26px; justify-items: center; }
.final h2 { font-size: clamp(2.4rem, 6vw, 4.4rem); line-height: 1; }
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 14px; width: 100%; max-width: 760px; }
.pod { flex: 1; min-width: 0; display: grid; gap: 8px; justify-items: center; }
.pod .bar { width: 100%; border-radius: 14px 14px 0 0; display: grid; place-items: start center; padding-top: 12px; font-family: var(--font-display); font-weight: 800; font-size: 2.4rem; color: #fff; transform-origin: bottom; }
.pod .nm { font-weight: 800; font-size: 1.1rem; overflow-wrap: anywhere; }
.pod .pts { font-family: var(--font-display); font-size: 1.3rem; color: var(--gold); font-variant-numeric: tabular-nums; }
.final .note { color: var(--muted); max-width: 56ch; line-height: 1.5; margin: 0; }
.confirm { display: grid; gap: 18px; max-width: 460px !important; text-align: center; justify-items: center; }
.confirm p { margin: 0; color: var(--muted); }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

#fx { position: fixed; inset: 0; pointer-events: none; z-index: 80; width: 100%; height: 100%; }
.float-pts { position: fixed; z-index: 85; pointer-events: none; left: 50%; top: 40%; transform: translate(-50%, -50%); font-family: var(--font-display); font-weight: 800; font-size: clamp(3rem, 9vw, 7rem); color: var(--gold); text-shadow: 0 6px 30px rgba(0,0,0,0.6); animation: floatUp 1.4s ease-out forwards; }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, -20%) scale(0.5); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -140%) scale(1); } }

@media (max-width: 860px) {
  .cards { grid-template-columns: 1fr; }

  const SWAP_ART = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#0c2549"/><rect x="22" y="40" width="110" height="62" rx="16" fill="#ff5a5f"/><path d="M50 100 l-8 20 24-20z" fill="#ff5a5f"/><rect x="68" y="98" width="110" height="62" rx="16" fill="#3fd0c9"/><path d="M150 158 l8 20 -24-20z" fill="#3fd0c9"/><path d="M44 71h66" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M38 60l78 22" stroke="#06162e" stroke-width="6" stroke-linecap="round"/><path d="M90 129h66" stroke="#06162e" stroke-width="8" stroke-linecap="round"/></svg>');

  // Base no Regimento, comum a todos os tipos de discriminação

  const DISC = [
    { id: "racismo", label: "Racismo", icon: "✊🏿", image: "img/disc/racismo.jpg", avoid: ["religiosa"],
      def: "O racismo é um sistema que cria uma hierarquia fundamentada na raça, em que determinado grupo racial passa a ter superioridade moral, cultural, econômica e política diante dos demais. Promove a inferiorização de um grupo em vários níveis do cotidiano.",
      ex: ["Uma pessoa é chamada ou tratada por meio de termos pejorativos que ferem a sua identidade racial.",

    const C = S.C; C.order = shuffle(C.options); S.correctPos = C.order.findIndex((o) => o.correct);
    const team = S.teams[S.turn];
    const qHtml = C.kind === "trocar"
      ? `<div style="display:grid;gap:12px"><p class="eyebrow" style="color:#a8f1ec">${esc(C.prompt)}</p><div class="quote" id="quote">"${esc(C.swap.from)}"</div></div>`
      : `<h2 class="question"><small>${esc(C.prompt)}</small><span id="qtext">${C.kind === "disc" ? C.q : esc(C.q)}</span></h2>`;
    show(`<div class="inner challenge">
      <div class="ch-head">
        <div class="ch-tags">${KIND_BADGE[C.kind]}<span class="tag">${C.icon} ${esc(C.label)}</span>${S.teams.length > 1 ? `<span class="tag turn">Vez da ${esc(team.name)}</span>` : ""}</div>
        <div class="timer" id="timer"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="42"/><circle class="bar" cx="50" cy="50" r="42" stroke-dasharray="263.9" stroke-dashoffset="0"/></svg><b>${S.time}</b></div>
      </div>
      ${qHtml}
      <div id="banner-slot"></div>
      <div class="options ${C.long ? "long" : ""}" id="options">
        ${C.order.map((o, pos) => `<button class="opt" data-pos="${pos}" data-c="${pos}" style="--c:${PLATES[pos].color}"><span class="key">${String.fromCharCode(65 + pos)}<small>${PLATES[pos].name}</small></span><span class="txt">${esc(o.text)}</span></button>`).join("")}
      </div>
      <div id="steal-slot"></div>
      <div class="ch-foot"><p class="hint" style="text-align:left">Clique na cor que a equipe levantou · atalhos <kbd>1</kbd>–<kbd>4</kbd></p><button class="ghost" id="skip">Revelar resposta</button></div>
    </div>`);
    root.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => pickOpt(Number(b.dataset.pos))));
    $("#skip").addEventListener("click", finishRound);
    if (G) {
      const tl = G.timeline({ defaults: { ease: "power3.out" } });
      tl.from(".ch-head", { y: -20, autoAlpha: 0, duration: 0.4 });
      if (C.kind === "trocar") tl.from("#quote", { scale: 0.7, rotation: -3, autoAlpha: 0, duration: 0.7, ease: "back.out(1.8)" });
      else if (HAS_SPLIT) { const sp = SplitText.create("#qtext", { type: "words" }); tl.from(sp.words, { y: 18, autoAlpha: 0, duration: 0.35, stagger: 0.018 }); }
      tl.from(".opt", { y: 40, autoAlpha: 0, duration: 0.4, stagger: 0.07, ease: "back.out(1.4)" }, "-=0.2");
      // o cronômetro só começa quando todas as alternativas estão visíveis
      tl.eventCallback("onComplete", () => { if (S.phase === "challenge" && !S.timerId) startTimer(S.time); });
    } else startTimer(S.time);
  }
  function clearTimer() { if (S.timerId) clearInterval(S.timerId); S.timerId = null; }
  function startTimer(sec) {
    clearTimer(); S.left = sec; const total = sec; paintTimer(total);
    S.timerId = setInterval(() => {
      S.left--; paintTimer(total);
      if (S.left <= 5 && S.left > 0) sfx.urgent(); else if (S.left > 0) sfx.beep();
      if (S.left <= 0) { clearTimer(); timeUp(); }
    }, 1000);
  }
  function paintTimer(total) {
    const el = $("#timer"); if (!el) return;
    el.querySelector("b").textContent = Math.max(0, S.left);
    el.querySelector(".bar").style.strokeDashoffset = 263.9 * (1 - Math.max(0, S.left) / total);
    el.classList.toggle("low", S.left <= 5);
  }
  function timeUp() { sfx.bad(); if (S.stage === "main") goSteal("Tempo esgotado!"); else if (S.stage === "steal") finishRound(); }
  function pickOpt(pos) {
    if (S.phase !== "challenge" || S.stage === "confirm" || S.tried.has(pos)) return;
    const btn = root.querySelector(`.opt[data-pos="${pos}"]`); if (!btn) return;
    if (pos === S.correctPos) {
      clearTimer(); btn.classList.add("right"); lockOptions();
      if (G) G.fromTo(btn, { scale: 1 }, { scale: 1.05, duration: 0.2, yoyo: true, repeat: 1 });
      if (S.stage === "main") {
        const pts = 100 + Math.max(0, S.left) * 4;
        S.prev = S.teams.map((t) => t.score); S.teams[S.turn].score += pts; S.result = { ok: true, pts, who: [S.turn] };
        sfx.good(); confetti(); floatPts("+" + pts); setTimeout(finishRound, 1300);
      } else { sfx.good(); askStealers(); }
    } else {
      S.tried.add(pos); btn.classList.add("wrong"); btn.disabled = true; sfx.bad();
      if (G) G.fromTo(btn, { x: -12 }, { x: 0, duration: 0.5, ease: "elastic.out(1, 0.3)" });
      if (S.stage === "main") goSteal("Resposta errada!");
      else if (S.tried.size >= 3) { clearTimer(); lockOptions(); S.stage = "confirm"; setTimeout(finishRound, 700); }
    }
  }
  function lockOptions() { root.querySelectorAll(".opt").forEach((b) => (b.disabled = true)); }
  function goSteal(msg) {
    if (S.teams.length < 2) { clearTimer(); lockOptions(); setTimeout(finishRound, 700); return; }
    S.stage = "steal";
    $("#banner-slot").innerHTML = `<div class="banner">${msg} REPASSE: as outras equipes levantam a plaquinha. Vale 50 pontos.</div>`;
    startTimer(12);
  }
  function askStealers() {
    S.stage = "confirm"; lockOptions(); const picked = new Set();
    const others = S.teams.map((t, i) => ({ t, i })).filter((o) => o.i !== S.turn);
    $("#steal-slot").innerHTML = `<div class="steal"><p>Quem acertou no repasse?</p>
      <div class="chips">${others.map((o) => `<button class="chip" data-i="${o.i}" aria-pressed="false" style="border-color:${o.t.color}">${esc(o.t.name)}</button>`).join("")}</div>
      <div class="row" style="justify-content:flex-start"><button class="cta" id="steal-ok" style="font-size:1.05rem;padding:12px 22px">Confirmar pontos</button><button class="ghost" id="steal-none">Ninguém</button></div></div>`;
    root.querySelectorAll(".steal .chip").forEach((b) => b.addEventListener("click", () => { const i = Number(b.dataset.i); picked.has(i) ? picked.delete(i) : picked.add(i); b.setAttribute("aria-pressed", picked.has(i)); }));
    $("#steal-ok").addEventListener("click", () => {
      const who = [...picked]; S.prev = S.teams.map((t) => t.score);
      who.forEach((i) => (S.teams[i].score += 50));
      S.result = { ok: false, steal: who.length > 0, pts: 50, who };
      if (who.length) { confetti(); floatPts("+50"); }
      setTimeout(finishRound, who.length ? 900 : 0);
    });
    $("#steal-none").addEventListener("click", finishRound);
    $("#steal-ok").focus();
  }

  // ----- Revelação -----
  function finishRound() {
    if (S.phase !== "challenge") return;
    clearTimer(); S.phase = "reveal";
    const C = S.C, r = S.result || { ok: false, who: [] };
    if (!S.prev) S.prev = S.teams.map((t) => t.score);
    let verdict, sub;
    if (r.ok) { verdict = `<h2 class="verdict ok">Acertou!</h2>`; sub = `${esc(S.teams[S.turn].name)} leva +${r.pts} pontos.`; }
    else if (r.steal) { verdict = `<h2 class="verdict ok">Roubou no repasse!</h2>`; sub = r.who.map((i) => esc(S.teams[i].name)).join(", ") + ` +${r.pts} pontos.`; }
    else { verdict = `<h2 class="verdict no">Não foi dessa vez</h2>`; sub = "Ninguém pontuou. Vamos entender juntos."; }
    S.pool = S.pool.filter((t) => t !== S.current); S.round++;
    const p = S.correctPos, correct = C.order[p];
    const answer = `<div class="answer" data-c="${p}" style="--c:${PLATES[p].color}"><span class="key">${String.fromCharCode(65 + p)}</span><span>${esc(correct.text)}</span></div>`;
    const card = (ic, color, label, head, text, strike) => `<div class="kc" style="--c:${color}"><span class="ic">${ic}</span><h4>${label}</h4><b class="${strike ? "strike" : ""}">${esc(head)}</b>${text ? `<p>${esc(text)}</p>` : ""}</div>`;
    let slogan, cards, extra = "", talk, more;
    if (C.kind === "reg") {
      const t = C.theme, d = t.tag ? DISC_BY[t.tag] : null;
      slogan = t.slogan;
      cards = card("📘", "var(--blue)", "O que diz o Regimento", t.regShort, t.desc) + card("⚖️", "var(--disc)", "Base legal", t.legalShort, t.legal) +
        (d ? card("🧭", "var(--swap)", "Tipo de discriminação ligado", d.label, d.act) : card("✅", "var(--swap)", "Na prática", "Combinado da turma", "Que atitude a turma assume a partir de hoje com esta regra?"));
      if (t.extra) extra = `<div class="extra"><b>Você sabia?</b> ${esc(t.extra)}</div>`;
      talk = t.talk;
      more = d ? `<h5>${esc(d.label)}: o que é</h5><p>${esc(d.def)}</p>` : "";
    } else if (C.kind === "disc") {
      const d = C.theme;
      slogan = d.slogan;
      cards = card("📘", "var(--blue)", "Regimento", "Discriminar é proibido", "Art. 26, III: não praticar, induzir ou incitar discriminação.") + card("⚖️", "var(--disc)", "Lei", d.lawShort, d.law) + card("✅", "var(--swap)", "Atitude", d.actShort, d.act);
      talk = d.talk;
      const others = C.order.map((o, i) => ({ o, i })).filter((x) => !x.o.correct);
      more = `<h5>Por que é ${esc(d.label)}?</h5><p>${esc(d.def)}</p><h5>E as outras situações?</h5><ul class="others">${others.map(({ o, i }) => `<li data-c="${i}" style="--c:${PLATES[i].color}"><span class="k">${String.fromCharCode(65 + i)}</span><span>Também é discriminação: <b>${esc(o.type.label)}</b>.</span></li>`).join("")}</ul><h5>O que diz o Regimento</h5><p>${esc(REG_DISC)}</p>`;
    } else {
      const sw = C.swap, d = DISC_BY[sw.tag];
      slogan = d.slogan;
      cards = card("🚫", "var(--bad)", "Frase a evitar", `"${sw.from}"`, "", true) + card("🔁", "var(--good)", "Que tal trocarmos por", `"${sw.to}"`, "") + card("🧭", "var(--disc)", "Por quê? · " + d.label, d.actShort, sw.why);
      talk = "Que outra frase comum a turma poderia trocar a partir de hoje?";
      more = `<h5>Algumas dicas</h5><p>Respeite os pronomes com que as pessoas se identificam. Se alguém tem deficiência, pergunte se precisa de ajuda e como ajudar. Nunca questione orientação sexual, identidade de gênero, raça ou deficiência.</p><h5>${esc(d.label)}: o que é</h5><p>${esc(d.def)}</p>`;
    }
    const gained = r.ok ? r.pts : r.steal ? r.pts : 0;
    show(`<div class="inner ra">
      <div class="ra-top">
        <div class="ra-thumb ${C.contain ? "contain" : ""}"><img src="${C.image}" alt="${esc(C.label)}"></div>
        <div class="ra-head"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${KIND_BADGE[C.kind]}<span class="eyebrow">${C.icon} ${esc(C.label)}</span></div>
          <div class="line">${verdict}${gained ? `<span class="pts-up" id="pts-up">+0 pontos</span>` : ""}</div><p class="verdict-sub" style="margin:0">${sub}</p></div>
      </div>
      ${answer}
      <p class="slogan" id="slogan"><mark>${esc(slogan)}</mark></p>
      <div class="cards">${cards}</div>
      ${extra}
      <div class="talkbar"><b>💬 Para conversar (1 minuto):</b> ${esc(talk)}</div>
      ${more ? `<details class="more"><summary>Ver mais: definição completa e detalhes</summary><div class="inner-more">${more}</div></details>` : ""}
      <div class="rv-foot"><button class="cta" id="next">${S.round >= S.totalRounds || !S.pool.length ? "Ver o pódio" : "Próxima rodada"}</button></div>
    </div>`);
    if (C.kind === "trocar") sfx.swap();
    const ptsEl = $("#pts-up");
    if (ptsEl) { if (G) { const o = { v: 0 }; G.to(o, { v: gained, duration: 1.2, ease: "power2.out", delay: 0.3, onUpdate: () => (ptsEl.textContent = "+" + Math.round(o.v) + " pontos") }); } else ptsEl.textContent = "+" + gained + " pontos"; }
    const mk = $("#slogan mark");
    if (G) {
      const tl = G.timeline({ defaults: { ease: "power3.out" } });
      tl.from(".ra-thumb", { scale: 0.5, autoAlpha: 0, duration: 0.5 })
        .from(".verdict", { scale: 0.5, autoAlpha: 0, duration: 0.6, ease: "back.out(2)" }, "-=0.3")
        .from(".answer", { y: 20, autoAlpha: 0, duration: 0.4 }, "-=0.2");
      if (HAS_SPLIT) { const sp = SplitText.create(mk, { type: "words" }); tl.from(sp.words, { y: 30, autoAlpha: 0, duration: 0.5, stagger: 0.08, ease: "back.out(1.8)" }); }
      tl.add(() => mk.classList.add("on"))
        .from(".kc", { rotationY: -90, autoAlpha: 0, duration: 0.7, stagger: 0.18, ease: "back.out(1.4)", transformOrigin: "left center" })
        .from(".extra, .talkbar, .more, .rv-foot", { y: 16, autoAlpha: 0, duration: 0.4, stagger: 0.08 }, "-=0.2");
    } else mk.classList.add("on");
    $("#next").addEventListener("click", nextRound);
  }
  function nextRound() {
    const prev = S.prev; S.prev = null;
    if (S.round >= S.totalRounds || !S.pool.length) return openFinal();
    S.turn = (S.turn + 1) % S.teams.length; S.phase = "stage"; S.current = null;
    if (vanta) vanta.setOptions({ color: VANTA_BASE });
    closeScreen(); drawWheel(); renderBoard(prev); $("#spin").focus();
  }

  // ----- Final -----
  function openFinal() {
    S.phase = "end"; renderBoard(); drawWheel();
    const ranked = S.teams.map((t, i) => ({ ...t, i })).sort((a, b) => b.score - a.score);
    const max = Math.max(1, ranked[0].score);
    const order = ranked.length >= 3 ? [ranked[1], ranked[0], ranked[2], ...ranked.slice(3)] : ranked;
    sfx.fanfare(); confetti(260);
    const tie = ranked.length > 1 && ranked[0].score === ranked[1].score;
    show(`<div class="inner final">
      <p class="eyebrow">Jornada da convivência concluída</p>
      <h2 id="final-title">${ranked.length > 1 ? (tie ? "Empate no topo!" : `${esc(ranked[0].name)} venceu!`) : `${esc(ranked[0].name)}: ${ranked[0].score} pontos!`}</h2>
      ${ranked.length > 1 ? `<div class="podium">${order.map((t) => { const place = ranked.indexOf(t) + 1; const h = 80 + 160 * (t.score / max);
        return `<div class="pod" data-place="${place}"><span class="nm">${esc(t.name)}</span><span class="pts">${t.score} pts</span><div class="bar" style="height:${h}px;background:${t.color}">${place}º</div></div>`; }).join("")}</div>` : ""}
      <p class="note">Vocês passaram por ${S.round} temas. Para fechar: cada equipe escolhe uma frase ou atitude que vai trocar a partir de hoje e explica em uma frase.</p>
      <div class="row"><button class="cta" id="again">Jogar de novo</button><button class="ghost" id="close-final">Ver o palco</button></div>
    </div>`);
    if (G) {
      const tl = G.timeline();
      if (HAS_SPLIT) { const sp = SplitText.create("#final-title", { type: "words, chars" }); tl.from(sp.chars, { y: 60, rotation: () => G.utils.random(-30, 30), autoAlpha: 0, duration: 0.6, stagger: 0.03, ease: "back.out(2)" }); }
      [...root.querySelectorAll(".pod")].sort((a, b) => b.dataset.place - a.dataset.place).forEach((pod) =>
        tl.from(pod.querySelector(".bar"), { scaleY: 0, duration: 0.8, ease: "elastic.out(1, 0.6)" }, "-=0.35").from(pod.querySelectorAll(".nm, .pts"), { y: 20, autoAlpha: 0, duration: 0.3 }, "-=0.5"));
    }
    $("#again").addEventListener("click", () => openSetup(true));
    $("#close-final").addEventListener("click", closeScreen);
  }

  function openConfirmReset() {
    if (S.spinning) return;
    const prevPhase = S.phase; clearTimer();
    show(`<div class="inner confirm"><h2>Reiniciar o jogo?</h2><p>O placar e os temas sorteados voltam ao início.</p>
      <div class="row"><button class="cta" id="yes">Reiniciar</button><button class="ghost" id="no">Continuar jogando</button></div></div>`);
    S.phase = "confirm";
    $("#yes").addEventListener("click", () => openSetup(true));
    $("#no").addEventListener("click", () => {
      if (prevPhase === "stage" || prevPhase === "end") { S.phase = prevPhase; closeScreen(); }
      else if (prevPhase === "setup") openSetup(false);
      else if (prevPhase === "suspense") openSuspense(S.current);
      else if (prevPhase === "challenge") { S.phase = "suspense"; openChallenge(); }
      else if (prevPhase === "reveal") { S.phase = "challenge"; S.round--; S.pool.push(S.current); finishRound(); }
    });
  }

  /* ================= EFEITOS ================= */
  const fx = $("#fx"), fctx = fx.getContext("2d"); let parts = [], fxRun = false;
  function confetti(n = 140) {
    if (REDUCED) return;
    fx.width = innerWidth; fx.height = innerHeight;
    const cols = ["#f6921e", "#ffcf4d", "#2f7fe0", "#2aa866", "#e5484d", "#c86bff", "#ffffff"];
    for (let i = 0; i < n; i++) parts.push({ x: innerWidth / 2 + (Math.random() - 0.5) * 200, y: innerHeight * 0.45, vx: (Math.random() - 0.5) * 16, vy: -Math.random() * 16 - 4, s: 6 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, c: cols[i % cols.length], life: 0 });
    if (!fxRun) { fxRun = true; requestAnimationFrame(stepFx); }
  }
  function stepFx() {
    fctx.clearRect(0, 0, fx.width, fx.height);
    parts.forEach((p) => { p.vy += 0.42; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++; fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.r); fctx.fillStyle = p.c; fctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); fctx.restore(); });
    parts = parts.filter((p) => p.y < fx.height + 40 && p.life < 400);
    if (parts.length) requestAnimationFrame(stepFx); else { fxRun = false; fctx.clearRect(0, 0, fx.width, fx.height); }
  }
  function floatPts(txt) { const d = document.createElement("div"); d.className = "float-pts"; d.textContent = txt; document.body.appendChild(d); setTimeout(() => d.remove(), 1500); }

  /* ================= CONTROLES ================= */
  $("#spin").addEventListener("click", spin);
  $("#btn-reset").addEventListener("click", openConfirmReset);
  $("#btn-sound").addEventListener("click", toggleSound);
  $("#btn-full").addEventListener("click", toggleFull);
  function toggleSound() { S.sound = !S.sound; const b = $("#btn-sound"); b.setAttribute("aria-pressed", S.sound); b.textContent = S.sound ? "Som ligado" : "Som desligado"; }
  function toggleFull() { try { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen().catch(() => {}); } catch (e) {} }
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    const k = e.key.toLowerCase();
    if (k === "m") return toggleSound();
    if (k === "f") return toggleFull();
    if (S.phase === "stage" && (k === " " || k === "enter")) { e.preventDefault(); spin(); }
    else if (S.phase === "suspense" && (k === " " || k === "enter")) { e.preventDefault(); openChallenge(); }
    else if (S.phase === "challenge" && ["1", "2", "3", "4", "a", "b", "c", "d"].includes(k)) pickOpt("1234".includes(k) ? Number(k) - 1 : "abcd".indexOf(k));
  });
  addEventListener("resize", fitCanvas);

  S.pool = buildPool("mista");
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitCanvas);
  fitCanvas(); renderBoard(); openSetup(true);
})();
</script>
